<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ИМПЕРИЯ: ПОСЛЕДНИЙ КРЕПОСТЬ</title>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/russo-one@latest/cyrillic-400-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/rubik@latest/cyrillic-400-normal.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/rubik@latest/cyrillic-700-normal.css" rel="stylesheet">
<style>
:root{
 --bg1:#171030; --bg2:#0d0a1d; --card:#ffffff10; --line:#ffffff1c;
 --gold:#ffcc4d; --gold2:#e09a1f; --txt:#f2edff; --dim:#a99cc9;
 --r0:#9aa7b8; --r1:#3fd06b; --r2:#43a7ff; --r3:#c06bff; --r4:#ffb02e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:#070512;font-family:'Rubik',sans-serif;color:var(--txt);display:flex;justify-content:center;overflow-x:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation}
a.btn{text-decoration:none}
#amb{position:fixed;inset:0;z-index:0;opacity:.5;pointer-events:none}
#app{position:relative;z-index:1;width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(var(--bg1),var(--bg2));box-shadow:0 0 60px #000c;overflow:hidden}
body.inbattle #topbar,body.inbattle #bottomnav{display:none}
/* ---------- SVG icons ---------- */
.ico{width:20px;height:20px;flex:none;vertical-align:-4px;filter:drop-shadow(0 1px 2px #000a)}
.ico-s{width:15px;height:15px}
.ico-l{width:30px;height:30px}
.ico-xl{width:46px;height:46px}
/* ---------- topbar ---------- */
#topbar{display:flex;align-items:center;gap:6px;padding:10px 10px 8px;background:linear-gradient(#1c1436f5,#140e28f0);border-bottom:1px solid #ffcc4d22;z-index:5}
.res{display:flex;align-items:center;gap:6px;background:linear-gradient(#00000066,#00000033);border:1px solid #ffcc4d2e;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;box-shadow:inset 0 1px 0 #ffffff14}
.res b{font-family:'Russo One';font-weight:400;font-size:12px}
#newsBtn,#gearBtn{width:38px;height:38px;border-radius:12px;background:linear-gradient(#2a2050,#1a1338);border:1px solid #ffcc4d33;display:flex;align-items:center;justify-content:center}
#newsBtn{margin-left:auto}
/* ---------- screen / nav ---------- */
#screen{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 12px 20px;scroll-behavior:smooth;position:relative;animation:scrIn .3s ease}
@keyframes scrIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#screen::-webkit-scrollbar{width:0}
#bottomnav{display:flex;background:linear-gradient(#1a1338f8,#120c26f8);border-top:1px solid #ffcc4d26;padding:6px 2px calc(8px + env(safe-area-inset-bottom));z-index:5}
.navBtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:9px;color:var(--dim);padding:5px 0;border-radius:12px;font-weight:700;letter-spacing:.4px}
.navBtn .ico{width:21px;height:21px;opacity:.75}
.navBtn.on{color:var(--gold)}
.navBtn.on .ico{opacity:1;filter:drop-shadow(0 0 6px #ffcc4d)}
/* ---------- typography / cards ---------- */
.h1{font-family:'Russo One';font-size:19px;letter-spacing:.5px;margin:4px 0 10px;text-shadow:0 2px 8px #000a}
.h2{font-family:'Russo One';font-size:14px;margin:14px 0 8px;color:var(--gold)}
.card{background:linear-gradient(165deg,#2b2153cc,#191130cc);border:1px solid #ffcc4d24;border-radius:16px;padding:12px;box-shadow:0 6px 18px #0007,inset 0 1px 0 #ffffff12;margin-bottom:10px}
/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:13px;padding:12px 14px;font-family:'Russo One';font-size:14px;letter-spacing:.5px;color:#fff;background:linear-gradient(#6a5ae0,#4a3aa8);box-shadow:0 4px 0 #2e2368,0 6px 16px #0008,inset 0 1px 0 #ffffff33;transition:.12s;overflow:hidden;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2e2368}
.btn.gold{background:linear-gradient(#ffe9a8,#e09a1f);color:#4a2f00;box-shadow:0 4px 0 #8a5c00,0 6px 16px #0008,inset 0 1px 0 #fff8}
.btn.green{background:linear-gradient(#7ce89a,#23a24a);box-shadow:0 4px 0 #136c30,0 6px 16px #0008,inset 0 1px 0 #fff6}
.btn.red{background:linear-gradient(#ff8d80,#c22e22);box-shadow:0 4px 0 #7c1a12,0 6px 16px #0008,inset 0 1px 0 #fff5}
.btn.ghost{background:#ffffff12;box-shadow:0 3px 0 #0006}
.btn.sm{padding:9px 12px;font-size:11px;border-radius:11px}
.btn.big{padding:16px 14px;font-size:15px;border-radius:15px}
.btn.dis{filter:grayscale(.8);opacity:.65}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;background:#00000077;border:1px solid #ffffff1a;border-radius:999px;padding:3px 10px}
.dim{color:var(--dim);font-size:12px}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.r0c{color:var(--r0)}.r1c{color:var(--r1)}.r2c{color:var(--r2)}.r3c{color:var(--r3)}.r4c{color:var(--r4)}
/* ---------- hero portrait frames ---------- */
.pframe{position:relative;border-radius:14px;overflow:hidden;border:2px solid var(--rc,#888);box-shadow:0 0 12px color-mix(in srgb,var(--rc) 55%,transparent),0 4px 10px #000a;background:#000}
.pframe img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.pframe .plvl{position:absolute;right:3px;bottom:3px;background:linear-gradient(#ffe9a8,#e09a1f);color:#4a2f00;font-family:'Russo One';font-size:10px;border-radius:7px;padding:1px 6px;box-shadow:0 2px 5px #000a}
.pframe.no img{filter:grayscale(1) brightness(.45)}
.rk0{--rc:var(--r0)}.rk1{--rc:var(--r1)}.rk2{--rc:var(--r2)}.rk3{--rc:var(--r3)}.rk4{--rc:var(--r4)}
/* ---------- home ---------- */
.scene{position:relative;height:200px;border-radius:18px;overflow:hidden;border:1px solid #ffcc4d33;background:linear-gradient(160deg,#2c1c5e,#12102a);background-size:cover;background-position:center 42%;box-shadow:0 8px 24px #0009,inset 0 0 0 2px #00000055;margin-bottom:12px}
.scene::after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 45%,#0d0a1dd9)}
.sc-lv{position:absolute;top:10px;left:10px;z-index:2;background:#000000aa;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 12px;font-family:'Russo One';font-size:11px;display:flex;align-items:center;gap:6px}
.sc-title{position:absolute;bottom:10px;left:0;right:0;text-align:center;z-index:2;font-family:'Russo One';font-size:21px;text-shadow:0 0 18px var(--gold),0 2px 6px #000}
.deco{position:absolute;z-index:2;font-size:18px;filter:drop-shadow(0 0 6px #ffd97a);animation:bob 3s ease-in-out infinite}
.d1{top:12px;right:14px}.d2{top:38px;right:42px;animation-delay:.5s}.d3{top:24px;left:40%;animation-delay:1s}.d4{top:56px;left:12%;animation-delay:1.4s}.d5{top:50px;right:12%;animation-delay:.8s}
.sc-glow{position:absolute;inset:auto 0 0 0;height:70px;z-index:1;pointer-events:none}
.g2{box-shadow:inset 0 -30px 40px -30px #ffd97a33}.g3{box-shadow:inset 0 -34px 46px -28px #ffd97a55}.g4{box-shadow:inset 0 -40px 55px -28px #ffd97a88}.g5{box-shadow:inset 0 -46px 65px -26px #ffe9a8cc}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.bld{display:flex;gap:10px;align-items:center}
.bico{width:54px;height:54px;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a2c6e,#171030);border-radius:14px;border:1px solid #ffcc4d33;box-shadow:inset 0 2px 6px #000a}
.bld.locked .bico{filter:grayscale(1);opacity:.55}
.bname{font-family:'Russo One';font-size:14px}
.blvl{color:var(--gold);font-size:11px;font-family:'Russo One'}
.beff{font-size:11.5px;color:var(--dim);margin-top:2px}
.cost{display:flex;gap:8px;font-size:12px;font-weight:700;margin:6px 0;flex-wrap:wrap;align-items:center}
.cost span{display:inline-flex;align-items:center;gap:4px}
.cost .no{color:#ff6d6d}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:14px;height:5px;border-radius:3px;background:#ffffff22}
.pips i.on{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.minebar{height:8px;border-radius:5px;background:#0008;overflow:hidden;margin:6px 0 4px}
.minebar i{display:block;height:100%;background:linear-gradient(90deg,#8fd3ff,#4a9eff);width:0%;transition:width .5s}
/* ---------- shop ---------- */
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:9px 4px;border-radius:12px;background:#ffffff0c;border:1px solid var(--line);font-family:'Russo One';font-size:11px;color:var(--dim)}
.tab.on{background:linear-gradient(#6a5ae0,#4a3aa8);color:#fff;border-color:#8f7dff;box-shadow:0 0 12px #6a5ae066}
.item{display:flex;gap:10px;align-items:center}
.iico{width:56px;height:56px;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a2c6e,#171030);border-radius:14px;border:1px solid #ffcc4d33}
.odds{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.odds span{font-size:10px;font-weight:700;background:#0006;border-radius:6px;padding:2px 5px}
/* ---------- heroes ---------- */
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hcard{position:relative;text-align:center;padding:12px 8px 10px;border-radius:16px;background:linear-gradient(165deg,#2b2153cc,#191130cc);border:2px solid var(--rc,#444);box-shadow:0 0 14px color-mix(in srgb,var(--rc) 35%,transparent),0 6px 14px #0008;transition:transform .15s}
.hcard:active{transform:scale(.97)}
.hcard .pframe{width:78px;height:78px;margin:0 auto 7px}
.hnm{font-family:'Russo One';font-size:13px}
.hsub{font-size:11px;margin-top:2px;font-weight:700}
.stars{color:var(--gold);font-size:11px;letter-spacing:2px;text-shadow:0 0 6px var(--gold)}
.teamchips{display:flex;gap:6px;margin-bottom:10px;min-height:44px}
.tchip{width:42px;height:42px;border-radius:11px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 8px #ffcc4d55}
.tchip img{width:100%;height:100%;object-fit:cover;object-position:top}
.tchip.empty{border-style:dashed;border-color:#ffffff33;opacity:.4}
/* ---------- map ---------- */
.mnode{position:relative;display:flex;align-items:center;gap:10px;margin:10px 0;padding:10px;border-radius:14px;background:linear-gradient(165deg,#2b2153aa,#191130aa);border:1px solid #ffcc4d22}
.mnode::before{content:'';position:absolute;left:50%;top:-12px;height:12px;width:2px;background:repeating-linear-gradient(#ffcc4d55 0 3px,transparent 3px 6px)}
.mnode:first-of-type::before{display:none}
.micon{width:50px;height:50px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:50%;background:radial-gradient(circle at 50% 30%,#3a2c6e,#171030);border:2px solid #ffffff33}
.mnode.open .micon{border-color:var(--gold);box-shadow:0 0 16px #ffcc4d88;animation:pulse 1.6s infinite}
.mnode.done .micon{border-color:var(--r1)}
.mnode.lock{opacity:.5}
.mnode.bossn .micon{width:58px;height:58px;border-color:var(--r3);box-shadow:0 0 18px var(--r3)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
/* ---------- battle ---------- */
#scrBattle{display:flex;flex-direction:column;height:100%;padding:0!important}
.bhud{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#00000077}
.bhud .t{font-family:'Russo One';font-size:13px}
.tgl{padding:7px 10px;border-radius:10px;background:#ffffff14;border:1px solid var(--line);font-family:'Russo One';font-size:11px;color:var(--dim)}
.tgl.on{background:var(--gold);color:#4a2f00;border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
#arena{flex:1;position:relative;display:flex;justify-content:space-between;align-items:center;padding:8px 8px;background:linear-gradient(160deg,#241740,#0d0a1d);background-size:cover;background-position:center;border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden}
#arena::after{content:'';position:absolute;inset:0;background:linear-gradient(#0d0a1d66,transparent 30%,transparent 70%,#0d0a1d99);pointer-events:none}
.ucol{display:flex;flex-direction:column;gap:8px;z-index:2;width:47%}
.ucol.right{align-items:flex-end}
.unit{position:relative;display:flex;align-items:center;gap:7px;width:100%;padding:6px 7px;border-radius:12px;background:#140e28e6;border:2px solid var(--rc,#fff3);box-shadow:0 4px 10px #0009;transition:opacity .5s,transform .5s,filter .5s}
.uav{width:40px;height:40px;flex:none;border-radius:50%;overflow:hidden;background:#000;border:2px solid var(--rc)}
.uav img{width:100%;height:100%;object-fit:cover;object-position:top center}
.uav.foe{display:flex;align-items:center;justify-content:center;border-radius:10px}
.uav.foe .ico{width:26px;height:26px}
.unm{font-size:10.5px;font-family:'Russo One';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.uinf{flex:1;min-width:0}
.hpbar{height:7px;border-radius:4px;background:#000c;overflow:hidden;margin-top:3px}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#5ede7c,#23a24a);transition:width .25s}
.unit.foe .hpbar i{background:linear-gradient(90deg,#ff7a6e,#d43a2e)}
.enbar{height:4px;border-radius:3px;background:#000c;overflow:hidden;margin-top:2px}
.enbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd97a,#e09a1f);transition:width .2s}
.unit.boss{border-color:var(--r3);box-shadow:0 0 18px var(--r3)}
.unit.boss .uav{width:52px;height:52px}
.unit.boss .uav .ico{width:34px;height:34px}
.unit.hit{animation:hitk .3s}
@keyframes hitk{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}60%{transform:translateX(5px)}}
.unit.lungeA{animation:lgA .35s}
.unit.lungeB{animation:lgB .35s}
@keyframes lgA{35%{transform:translateX(26px)}}
@keyframes lgB{35%{transform:translateX(-26px)}}
.unit.dead{opacity:.2;filter:grayscale(1);transform:scale(.88)}
.unit.frozen::before{content:'';position:absolute;inset:0;background:#7fd8ff44;border-radius:10px;z-index:3}
.unit.frozen::after{content:'';position:absolute;inset:0;z-index:4;border-radius:10px;background:radial-gradient(circle at 50% 40%,#e8fbff88 0 6%,transparent 8%),radial-gradient(circle at 30% 60%,#e8fbff77 0 5%,transparent 7%),radial-gradient(circle at 70% 65%,#e8fbff77 0 5%,transparent 7%)}
.unit.shielded::after{content:'';position:absolute;inset:-3px;border-radius:14px;border:2px solid #7fd8ff88;box-shadow:0 0 10px #7fd8ff66;z-index:3}
.dmg{position:absolute;z-index:9;font-family:'Russo One';font-size:16px;color:#ff6d6d;text-shadow:0 2px 4px #000;animation:floatUp .9s forwards;pointer-events:none}
.dmg.crit{color:var(--gold);font-size:21px}
.dmg.heal{color:#5ede7c}
@keyframes floatUp{to{transform:translateY(-52px);opacity:0}}
#abbar{display:flex;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:#140e28f0}
.abb{position:relative;flex:1;height:58px;border-radius:13px;background:#0009;border:2px solid var(--rc,#fff3);overflow:hidden}
.abb .abf{position:absolute;left:0;bottom:0;width:100%;background:linear-gradient(#ffd97a55,#e09a1f88);height:0%}
.abb .ico{position:relative;z-index:2;width:26px;height:26px}
.abb.rdy{border-color:var(--gold);box-shadow:0 0 14px var(--gold);animation:pulse 1s infinite}
.abb.dead{opacity:.3;filter:grayscale(1)}
#app.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translate(0)}20%{transform:translate(-7px,4px)}40%{transform:translate(6px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,4px)}}
/* ---------- chests ---------- */
.chwrap{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px 0;position:relative}
.chestwrap{width:158px;height:128px;filter:drop-shadow(0 10px 24px #000c)}
.chestwrap svg{width:100%;height:100%}
.chestwrap.sway{animation:sway 1.2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.chestwrap.shake{animation:chsh .12s linear infinite}
@keyframes chsh{0%{transform:translate(0,0) rotate(0)}25%{transform:translate(-4px,2px) rotate(-2deg)}50%{transform:translate(4px,-2px) rotate(2deg)}75%{transform:translate(-3px,-2px) rotate(-1deg)}}
.chestwrap.open{animation:chestpop .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes chestpop{0%{transform:scale(1)}45%{transform:scale(1.18) rotate(2deg)}100%{transform:scale(1)}}
.rays{position:absolute;left:50%;top:50%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:repeating-conic-gradient(#ffd97a44 0 9deg,transparent 9deg 22deg);animation:spin 5s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.reveal{display:flex;flex-direction:column;align-items:center;gap:8px;padding:8px 0;animation:popIn .5s cubic-bezier(.3,1.6,.5,1)}
.rvic{width:100px;height:100px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:radial-gradient(circle at 50% 30%,#3a2c6e,#171030);border:3px solid var(--rc);box-shadow:0 0 26px var(--rc);overflow:hidden}
.rvic img{width:100%;height:100%;object-fit:cover;object-position:top center}
.rvic .ico{width:52px;height:52px}
/* ---------- modal / toasts ---------- */
#modal{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:#000000c9;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.mcard{width:92%;max-width:420px;max-height:86dvh;overflow-y:auto;background:linear-gradient(165deg,#332663,#191130);border:1px solid #ffcc4d3d;border-radius:20px;padding:18px;box-shadow:0 20px 60px #000d,inset 0 1px 0 #ffffff1a;animation:slideUp .35s cubic-bezier(.3,1.4,.5,1)}
.mcard::-webkit-scrollbar{width:0}
@keyframes slideUp{from{transform:translateY(40px);opacity:0}}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
#toasts{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:92%;max-width:440px}
.toast{background:#000000e6;border:1px solid var(--gold);color:var(--txt);border-radius:12px;padding:8px 16px;font-size:13px;font-weight:700;animation:slideUp .3s;box-shadow:0 6px 18px #000c;text-align:center}
#fx{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
.pt{position:absolute;width:8px;height:8px;border-radius:50%;animation:pt .9s forwards}
@keyframes pt{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.flash{position:fixed;inset:0;animation:fl .5s forwards;pointer-events:none}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid #ffffff22;border-top-color:var(--gold);animation:spin 1s linear infinite;margin:0 auto}
body.lowq .rays,body.lowq .deco{animation:none}
.sw{width:52px;height:28px;border-radius:999px;background:#ffffff22;position:relative;transition:.2s;flex:none}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--gold)}
.sw.on::after{left:27px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:8px;border-radius:10px;background:#ffffff10;border:1px solid var(--line);font-size:12px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--gold);color:#4a2f00;border-color:var(--gold)}
.achrow{display:flex;gap:10px;align-items:center}
.achico{width:46px;height:46px;flex:none;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 30%,#3a2c6e,#171030);border-radius:12px;border:1px solid #ffcc4d33}
.abar{height:7px;border-radius:4px;background:#0008;overflow:hidden;margin-top:4px}
.abar i{display:block;height:100%;background:linear-gradient(90deg,#8f7dff,#6a5ae0)}
.card.donecard{border-color:#3fd06b66}
.card.claimcard{border-color:#ffcc4d66}
.lockbox{text-align:center;padding:30px 14px}
.lockbox .lk{font-size:44px;margin-bottom:8px}
.devb{text-align:center;font-family:'Russo One';font-size:11px;letter-spacing:2.5px;color:#8f7dff;opacity:.85;margin:4px 0 4px;text-shadow:0 0 12px #6a5ae066}
/* ---------- updates ---------- */
.upcard{border:1px solid #ffcc4d44;animation:upIn .5s cubic-bezier(.3,1.3,.5,1) both}
.upcard .uhead{display:flex;align-items:center;gap:10px;border-bottom:1px dashed #ffcc4d33;padding-bottom:9px;margin-bottom:9px}
.upbadge{font-family:'Russo One';font-size:14px;color:#4a2f00;background:linear-gradient(#ffe9a8,#e09a1f);border-radius:10px;padding:6px 12px;box-shadow:0 3px 0 #8a5c00;display:flex;align-items:center;gap:7px}
.uplist{list-style:none;margin:6px 0 2px}
.uplist li{padding:5px 0 5px 20px;position:relative;font-size:13px}
.uplist li::before{content:'';position:absolute;left:6px;top:11px;width:7px;height:7px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 5px var(--gold)}
.upmsg{background:#00000055;border-left:3px solid var(--gold);border-radius:0 12px 12px 0;padding:10px 12px;margin-top:10px;font-size:12.5px;line-height:1.55;color:#e8e0ff}
.upmsg .sign{display:block;margin-top:8px;font-family:'Russo One';color:var(--gold);letter-spacing:1px}
@keyframes upIn{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
/* ---------- team screen (уровень) ---------- */
.team-wrap{padding-bottom:110px}
.team-actions{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(6px + env(safe-area-inset-bottom));width:100%;max-width:480px;padding:10px 12px;background:linear-gradient(0deg,#120c26 0%,#120c26ee 70%,#120c2600 100%);z-index:6;pointer-events:none}
.team-actions-inner{display:flex;gap:10px;pointer-events:auto;animation:teamActIn .45s cubic-bezier(.3,1.4,.5,1) both}
@keyframes teamActIn{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.team-actions-inner .btn{flex:1;padding:14px 10px;font-size:13px;border-radius:14px}
.team-actions-inner .btn.back{background:linear-gradient(#4a3aa8,#2e2368);box-shadow:0 4px 0 #1a1338,0 6px 14px #0008,inset 0 1px 0 #ffffff2a}
/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(900px 600px at 50% 18%,#372167 0%,#171030 45%,#0a0716 100%);transition:opacity .7s;overflow:hidden}
#boot.off{opacity:0;pointer-events:none}
.lb-glow{position:absolute;top:12%;left:50%;width:340px;height:340px;margin-left:-170px;border-radius:50%;background:radial-gradient(circle,#ffd97a22 0%,transparent 70%);pointer-events:none;animation:lbGlow 4s ease-in-out infinite}
@keyframes lbGlow{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.12)}}
.lb-sp{position:absolute;color:#ffd97a;opacity:.4;font-size:12px;animation:lbFloat 6s ease-in-out infinite;pointer-events:none}
@keyframes lbFloat{0%,100%{transform:translateY(0);opacity:.25}50%{transform:translateY(-22px);opacity:.75}}
.lb-crest{position:relative;z-index:2;filter:drop-shadow(0 0 22px #ffcc4d);animation:bob 3s ease-in-out infinite}
.lb-crest .ico{width:70px;height:70px}
.lb-title{font-family:'Russo One';font-size:31px;color:var(--gold);text-shadow:0 0 26px var(--gold),0 3px 8px #000;margin-top:12px;position:relative;z-index:2;text-align:center}
.lb-sub{font-size:11px;letter-spacing:4px;color:var(--dim);margin-top:5px;position:relative;z-index:2}
.lb-load{font-family:'Russo One';font-size:13px;color:#cbb8ff;letter-spacing:2px;margin-top:36px;position:relative;z-index:2;animation:pulse 1.7s infinite}
.lb-bar{width:min(76%,350px);height:18px;border-radius:12px;background:#00000088;border:1px solid #ffcc4d33;margin-top:12px;overflow:hidden;box-shadow:inset 0 2px 8px #000a;position:relative;z-index:2}
.lb-bar i{display:block;height:100%;width:0%;border-radius:12px;background:linear-gradient(90deg,#8a6a1c,#ffd97a 55%,#e09a1f);box-shadow:0 0 16px #ffcc4dcc;transition:width .18s ease}
.lb-pct{font-family:'Russo One';font-size:27px;color:var(--gold);margin-top:12px;text-shadow:0 0 16px var(--gold);position:relative;z-index:2}
.lb-stage{font-size:13px;color:var(--dim);margin-top:6px;min-height:19px;position:relative;z-index:2;transition:opacity .22s}
.lb-stage.fadeout{opacity:0}
.lb-ver{position:absolute;bottom:12px;font-family:'Russo One';font-size:10px;letter-spacing:2px;color:#8f7dff99;z-index:2}

/* ---------- STABILITY PATCH ---------- */
html,body{width:100%;min-height:100%;background:#070512}
#app{width:100%;min-width:0;max-width:480px;height:100vh;height:100dvh}
#boot{background:radial-gradient(900px 600px at 50% 18%,#372167 0%,#171030 45%,#0a0716 100%)}

const SHOP_LIMITS={stones:3,coins:3,crystal:2,scroll:1,frag:2};
const SHOP_PRICES={stones:50,coins:55,crystal:60,scroll:120,frag:70};
const SHOP_RANGES={stones:[300,600],coins:[400,700]};
const SHOP_SPECIAL_QTY={crystal:1,scroll:1,frag:10};
function getShopDayKey(){
 const now=new Date(Date.now()+3*3600000);
 return now.getUTCFullYear()*10000+(now.getUTCMonth()+1)*100+now.getUTCDate();
}
function seededRand(seed){let h=seed|0;return function(){h=h*1664525+1013904223|0;return(h>>>0)/4294967296}}
function getDailyShopOffers(){
 const dayKey=getShopDayKey();
 const rng=seededRand(dayKey);
 const stonesAmt=Math.floor(rng()*(SHOP_RANGES.stones[1]-SHOP_RANGES.stones[0]+1))+SHOP_RANGES.stones[0];
 const coinsAmt=Math.floor(rng()*(SHOP_RANGES.coins[1]-SHOP_RANGES.coins[0]+1))+SHOP_RANGES.coins[0];
 return{dayKey,stonesAmt,coinsAmt};
}
function getShopState(){
 if(!S.shopState)S.shopState={dayKey:0,bought:{}};
 const offers=getDailyShopOffers();
 if(S.shopState.dayKey!==offers.dayKey){
  S.shopState={dayKey:offers.dayKey,bought:{}};
  save();
 }
 return{offers,bought:S.shopState.bought};
}
function shopCanBuy(id){
 const st=getShopState();
 const limit=SHOP_LIMITS[id];
 const used=st.bought[id]||0;
 if(used>=limit)return{can:false,reason:'limit'};
 if(S.diamonds<SHOP_PRICES[id])return{can:false,reason:'gems'};
 return{can:true};
}
function shopBuy(id){
 const chk=shopCanBuy(id);
 if(!chk.can){
  sfx('error');
  toast(chk.reason==='limit'?'❌ Дневной лимит исчерпан':'❌ Недостаточно алмазов');
  return false;
 }
 S.diamonds-=SHOP_PRICES[id];
 const st=getShopState();
 st.bought[id]=(st.bought[id]||0)+1;
 save();
 return true;
}

const AU={ctx:null,mTimer:null,cur:null,
 init(){try{if(!this.ctx){this.ctx=new(window.AudioContext||window.webkitAudioContext)()}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume()}catch(e){this.ctx=null}},
 note(f,dt,d,ty,v){try{const c=this.ctx;if(!c)return;const t=c.currentTime+dt;const o=c.createOscillator(),g=c.createGain();o.type=ty||'sine';o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v||.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}};

 switch(n){

const MCHORDS=[[45,52,57,60],[45,52,57,60],[41,48,53,57],[41,48,53,57],[48,55,60,64],[43,50,55,59],[45,52,57,60],[45,52,57,60]];
const MMEL=[[8,69,2],[10,72,1],[11,74,1],[12,76,2],[14,74,1],[15,72,1],[16,76,1],[17,79,1],[18,81,2],[20,79,1],[21,76,1],[22,74,2],[24,72,1],[25,74,1],[26,76,2],[28,74,1],[29,72,1],[30,69,2]];
function mPad(f,t,dur,v){try{const c=AU.ctx;if(!c||!MU.gain)return;
 const g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=850;
 const o1=c.createOscillator();o1.type='sine';o1.frequency.value=f;
 const o2=c.createOscillator();o2.type='triangle';o2.frequency.value=f*1.003;
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+1.3);g.gain.setValueAtTime(v,t+Math.max(1.4,dur-0.4));g.gain.linearRampToValueAtTime(0.0001,t+dur+1.5);
 o1.connect(fl);o2.connect(fl);fl.connect(g);g.connect(MU.gain);
 o1.start(t);o2.start(t);o1.stop(t+dur+1.6);o2.stop(t+dur+1.6)}catch(e){}}
function mDrone(f,t,dur){try{const c=AU.ctx;if(!c||!MU.gain)return;
 const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.05,t+.8);g.gain.setValueAtTime(.05,t+dur-.5);g.gain.linearRampToValueAtTime(0.0001,t+dur+.8);
 o.connect(g);g.connect(MU.gain);o.start(t);o.stop(t+dur+1)}catch(e){}}
function mChoir(ch,t,dur){try{const c=AU.ctx;if(!c||!MU.gain)return;
 [ch[2]+12,ch[3]+12].forEach(f=>{
  const o=c.createOscillator(),o2=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();
  fl.type='lowpass';fl.frequency.value=1400;
  o.type='sine';o.frequency.value=noteF(f);o2.type='sine';o2.frequency.value=noteF(f)*1.005;
  const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=4.8;lg.gain.value=2.2;lfo.connect(lg);lg.connect(o.frequency);lg.connect(o2.frequency);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.017,t+1.8);g.gain.setValueAtTime(.017,t+dur-.6);g.gain.linearRampToValueAtTime(0.0001,t+dur+1.2);
  o.connect(fl);o2.connect(fl);fl.connect(g);g.connect(MU.gain);
  o.start(t);o2.start(t);lfo.start(t);o.stop(t+dur+1.4);o2.stop(t+dur+1.4);lfo.stop(t+dur+1.4)})}catch(e){}}
function mHorn(f,t,dur){try{const c=AU.ctx;if(!c||!MU.gain)return;
 const o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1500;
 o.type='triangle';o.frequency.value=f;
 const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=5.2;lg.gain.value=3;lfo.connect(lg);lg.connect(o.frequency);
 g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(.062,t+.16);g.gain.setValueAtTime(.062,t+Math.max(.2,dur-.25));g.gain.linearRampToValueAtTime(0.0001,t+dur+.35);
 o.connect(fl);fl.connect(g);g.connect(MU.gain);
 o.start(t);lfo.start(t);o.stop(t+dur+.5);lfo.stop(t+dur+.5)}catch(e){}}
function mThump(t,v){try{const c=AU.ctx;if(!c||!MU.gain)return;
 const o=c.createOscillator(),g=c.createGain();o.type='sine';
 o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(36,t+.3);
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+.5);
 o.connect(g);g.connect(MU.gain);o.start(t);o.stop(t+.6)}catch(e){}}
function scheduleBeat(b,t){const BD=.8,bar=b>>2,ib=b&3;
 if(ib===0){const ch=MCHORDS[bar];for(const m2 of ch)mPad(noteF(m2),t,BD*4,.026);mDrone(noteF(ch[0]-12),t,BD*4);if(bar>=4)mChoir(ch,t,BD*4)}
 if(bar>=2&&ib===0)mThump(t,bar>=4?.22:.13);
 if(bar>=4&&ib===2)mThump(t,.12);
 for(const ev of MMEL){if(ev[0]===b)mHorn(noteF(ev[1]),t,ev[2]*BD)}}
function menuTick(){try{const c=AU.ctx;if(!c||!S.set.music||!MU.active){stopMusic();return}
 while(MU.nextT<c.currentTime+1.4){scheduleBeat(MU.beat%32,MU.nextT);MU.nextT+=.8;MU.beat++}}catch(e){}}

let B=null,BINT=null;
function makeFoes(ch,s){
 const m=1+.9*(ch-1),ma=1+.85*(ch-1),md=1+.6*(ch-1);
 const out=[];
 const foesPool=FOES_BY_CHAPTER[ch-1]||FOES_BY_CHAPTER[0];
 const cfg=LEVEL_ENEMIES[ch-1]?LEVEL_ENEMIES[ch-1][s-1]:null;
 const isBoss=cfg&&typeof cfg==='object'&&cfg.boss;
 const count=isBoss?cfg.minions:(typeof cfg==='number'?cfg:3);
 /* Обычные враги */
 for(let i=0;i<count;i++){
  const f=foesPool[i%foesPool.length];
  const hp=Math.round((320+130*s)*m);
  out.push({name:f.n,ic:f.ic,rar:0,hp,mhp:hp,atk:Math.round((52+18*s)*ma),def:Math.round((15+6*s)*md),spd:88+s*3,boss:false});
 }
 /* Босс */
 if(isBoss){
  const bd=CH[ch-1].boss;
  out.push({name:bd.n,ic:bd.ic,rar:4,hp:bd.hp,mhp:bd.hp,atk:bd.atk,def:bd.def,spd:bd.spd,boss:true,bab:bd.ab});
 }

async function runLoadingBar(){
 try{
  let p=0;const t0=Date.now();const MAXMS=6500;
  lbShow(0);
  while(p<100){
   if(Date.now()-t0>MAXMS){p=100;lbShow(100);break}
   if(Math.random()<0.14&&p<88){
    const j=ri(6,14);
    for(let i=0;i<j&&p<100;i++){p++;lbShow(p);await sleep(ri(14,34))}
    continue}
   if(Math.random()<0.16){
    const reps=ri(2,4);
    for(let r2=0;r2<reps;r2++){lbShow(p);await sleep(ri(120,320))}}
   p=Math.min(100,p+ri(1,2));
   lbShow(p);
   await sleep(ri(25,70));
  }
  lbShow(100);
  await sleep(ri(600,950));
 }catch(e){}
 finishLoadingScreen()}
function postBootFlow(){
 try{
  if(!S.updates||typeof S.updates!=='object')S.updates={lastSeen:'1.0',welcomed:false};
  if(!S.updates.welcomed){showWelcomeFirst();return}
 }catch(e){}
 try{toast('Прогресс сохраняется в файл: Настройки → Сохранить прогресс')}catch(e){}}
function finishLoadingScreen(){if(LB_FINISHED)return;LB_FINISHED=true;window.__BOOT_DONE=true;
 try{const b=$('#boot');if(b){b.classList.add('off');setTimeout(()=>{try{b.remove()}catch(e){}},800)}}catch(e){}
 setTimeout(()=>{try{postBootFlow()}catch(e){}},450)}
let BOOTED=false;
function finishBoot(){
 if(BOOTED)return;
 try{ensureQuests()}catch(e){}
 let rendered=false;
 try{updTop();go('home');rendered=true}catch(e){}
 if(!rendered){try{const sc=$('#screen');if(sc)sc.innerHTML='<div class="card"><div class="h1">ИМПЕРИЯ</div><div class="dim">Ошибка интерфейса. Перезагрузите страницу.</div></div>'}catch(e){}}
 BOOTED=true;
 try{runLoadingBar()}catch(e){try{finishLoadingScreen()}catch(_){}}
 setTimeout(()=>{try{finishLoadingScreen()}catch(e){}},7500)}
try{const lc=$('#lbCrest');if(lc)lc.innerHTML=ic('castle','ico-xl')}catch(e){}
[HOME_BG].forEach(u=>{try{const im=new Image();im.src=u}catch(e){}});
try{document.body.classList.toggle('lowq',S.set.q==='low');updTop()}catch(err){}
setTimeout(finishBoot,300);
setTimeout(()=>{try{finishBoot()}catch(e){}},1500);
setTimeout(()=>{try{finishBoot()}catch(e){}},4000);
document.addEventListener('pointerdown',function once(){try{AU.init()}catch(e){}document.removeEventListener('pointerdown',once)});
// Boot watchdog: the game must never remain behind the loading layer.
setTimeout(()=>{try{if(!window.__BOOT_DONE)finishLoadingScreen()}catch(e){}},9000);
window.addEventListener('error',()=>{setTimeout(()=>{try{if(!window.__BOOT_DONE)finishLoadingScreen()}catch(e){}},0)});
window.addEventListener('unhandledrejection',()=>{setTimeout(()=>{try{if(!window.__BOOT_DONE)finishLoadingScreen()}catch(e){}},0)});

</script>
